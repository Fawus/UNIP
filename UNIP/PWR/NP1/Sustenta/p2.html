<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booststrap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
  <nav class="NAV navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="assets/unip.png" alt="Logo" style="width: 50px; height: 50px;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="p.html">Home</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle fs-4 text-danger fw-bold" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">02</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item fw-bold" href="p3.html">03</a></li>
              <li><a class="dropdown-item fw-bold" href="p4.html">04</a></li>
              <li><a class="dropdown-item fw-bold" href="p5.html">05</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex" role="search" onsubmit="handleSearch(event)">
          <input id="searchInput" class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
          <button class="btn btn-outline-danger" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>
  <h1 class="text-center">Teste de Bootstrap</h1>

 
  <script>
    function handleSearch(event) {
      event.preventDefault(); // Evita o envio padrão do formulário

      const searchInput = document.getElementById('searchInput').value.toLowerCase();
      const links = [
        { keyword: 'home', url: 'index.html' },
        { keyword: 'generos', url: '#' },
        { keyword: '02', url: 'p2.html' },
        { keyword: '03', url: 'p3.html' },
        { keyword: '04', url: 'p4.html' },
        { keyword: '05', url: 'p5.html' }
      ];

      const result = links.find(link => link.keyword.includes(searchInput));

      if (result) {
        window.location.href = result.url; // Redireciona para o link correspondente
      } else {
        alert('Erro: Não foi possível encontrar o que você pesquisou.');
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
